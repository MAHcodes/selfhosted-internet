services:
  zennotes:
    image: adibhanna/zennotes:latest
    container_name: zennotes
    user: "${UID:-1000}:${GID:-1000}"
    restart: no
    ports:
      - "127.0.0.1:7778:7878"
    environment:
      ZENNOTES_AUTH_TOKEN: "${ZENNOTES_AUTH_TOKEN}"
    volumes:
      - "./vault:/workspace"
      - "./data:/data"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
